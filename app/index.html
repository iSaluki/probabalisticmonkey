<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probabilistic Monkey</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f0b; }
  body {
    color: #33ff66; font: 15px/1.5 "DejaVu Sans Mono", Menlo, Consolas, "Courier New", monospace;
    display: flex; flex-direction: column; text-shadow: 0 0 4px rgba(51, 255, 102, 0.35);
  }
  #log { flex: 1; overflow-y: auto; padding: 16px 16px 0; white-space: pre-wrap; word-wrap: break-word; }
  .user { color: #b8ffcc; }
  .dim { color: #1f9a3e; }
  .model { cursor: pointer; }
  .model:hover { text-decoration: underline; }
  .model.active { color: #b8ffcc; }
  .model.missing { color: #1f6a32; cursor: default; text-decoration: none; }
  #line { display: flex; padding: 8px 16px 16px; }
  #prompt { margin-right: 0.6em; white-space: pre; }
  #in {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: inherit; font: inherit;
    caret-color: #33ff66; text-shadow: inherit; padding: 0;
  }
</style>
</head>
<body>
<div id="log"><span class="dim">PROBABILISTIC PRIMATES - small language models running on this computer
</span><span id="models" class="dim">models: loading...</span><span class="dim">
type a message and press enter. switch model with /model monkey or /model gorilla, or click a name above.
</span>
</div>
<div id="line"><span id="prompt">&gt;</span><input id="in" autofocus autocomplete="off" spellcheck="false" aria-label="message"></div>
<script>
const log = document.getElementById("log"), input = document.getElementById("in");
const promptEl = document.getElementById("prompt"), modelsEl = document.getElementById("models");
const history = [];
let models = [], current = null, busy = false;

function add(text, cls) {
  const s = document.createElement("span");
  if (cls) s.className = cls;
  s.textContent = text;
  log.appendChild(s);
  log.scrollTop = log.scrollHeight;
  return s;
}

const millions = (n) => (n / 1e6).toFixed(1) + "M";
const describe = (m) => `${m.name} - ${millions(m.params_total)} parameters, ${millions(m.params_active)} active per token`;

function renderModels() {
  modelsEl.textContent = "";
  modelsEl.append("models:");
  for (const m of models) {
    const row = document.createElement("span");
    row.textContent = `\n  ${m.id === current ? "*" : " "} ${m.id.padEnd(8)} ${millions(m.params_total).padStart(7)} parameters `
      + `(${millions(m.params_active)} active per token)` + (m.available ? "" : "  [not installed]");
    row.className = "model" + (m.id === current ? " active" : "") + (m.available ? "" : " missing");
    if (m.available) row.onclick = () => { if (!busy) switchTo(m.id); };
    modelsEl.appendChild(row);
  }
  promptEl.textContent = (current || "") + ">";
}

async function loadModels() {
  try {
    const res = await fetch("/models");
    const data = await res.json();
    models = data.models;
    current = data.default;
  } catch (err) {
    add("[could not reach the server: " + err.message + "]\n", "dim");
  }
  renderModels();
}

async function switchTo(id) {
  const m = models.find((x) => x.id === id);
  if (!m) { add(`[unknown model "${id}" - try /models]\n`, "dim"); return; }
  if (!m.available) { add(`[${m.name} is not installed on this server]\n`, "dim"); return; }
  if (id === current) { add(`[already talking to ${describe(m)}]\n`, "dim"); return; }
  busy = true;
  const note = add(`[loading ${m.name}...]\n`, "dim");
  try {
    const res = await fetch("/load", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: id }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    current = id;
    note.textContent = `[now talking to ${describe(m)}]\n`;
    renderModels();
  } catch (err) {
    note.textContent = `[could not load ${m.name}: ${err.message}]\n`;
  }
  busy = false;
  input.focus();
}

function command(text) {
  const [cmd, arg] = text.slice(1).trim().split(/\s+/);
  if (cmd === "model" && arg) return switchTo(arg.toLowerCase());
  if (cmd === "models" || cmd === "model") {
    add("\n" + models.map((m) => `${m.id === current ? "*" : " "} ${m.id}: ${describe(m)}${m.available ? "" : " [not installed]"}`).join("\n") + "\n", "dim");
    return;
  }
  add(`[commands: /model monkey, /model gorilla, /models]\n`, "dim");
}

input.addEventListener("keydown", async (e) => {
  if (e.key !== "Enter" || busy) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  if (text.startsWith("/")) { add("\n> " + text + "\n", "user"); await command(text); return; }
  busy = true;
  add("\n" + current + "> " + text + "\n", "user");
  history.push({ role: "user", content: text });
  const out = add("");
  let reply = "";
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: current, messages: history }),
    });
    if (!res.ok) throw new Error("server said " + res.status);
    const reader = res.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      reply += dec.decode(value, { stream: true });
      out.textContent = reply.replace(/^\s+/, "");
      log.scrollTop = log.scrollHeight;
    }
    reply = reply.trim();
    if (!reply) out.textContent = "...";
    history.push({ role: "assistant", content: reply || "..." });
  } catch (err) {
    history.pop();
    add("[error: " + err.message + "]", "dim");
  }
  add("\n");
  busy = false;
  input.focus();
});
document.addEventListener("click", (e) => { if (!e.target.classList.contains("model")) input.focus(); });
loadModels();
</script>
</body>
</html>
